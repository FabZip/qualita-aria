<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071d2a">
  <title>A.R.I.A. — Splash demo</title>
  <link rel="stylesheet" href="splash.css">
</head>
<body>
  <main class="app-preview" aria-label="Contenuto simulato dell'applicazione">
    <header class="app-header">
      <strong>A.R.I.A.</strong>
      <span>Indicatori ambientali · Roma</span>
    </header>
    <section class="map-preview" aria-hidden="true">
      <div class="map-grid"></div>
      <div class="river"></div>
      <div class="road road-a"></div>
      <div class="road road-b"></div>
      <div class="station station-a"><span>42</span></div>
      <div class="station station-b"><span>31</span></div>
      <div class="station station-c"><span>58</span></div>
      <div class="map-card"><b>Qualità dell'aria</b><small>Panoramica ambientale</small></div>
    </section>
  </main>

  <section class="splash" id="ariaSplash" aria-label="Introduzione A.R.I.A.">
    <button class="skip" id="skipSplash" type="button">Salta</button>
    <div class="atmosphere" aria-hidden="true"></div>

    <div class="intro" role="img" aria-label="A.R.I.A., Analisi e Rappresentazione degli Indicatori Ambientali">
      <svg class="environment" viewBox="0 0 920 390" aria-hidden="true">
        <defs>
          <linearGradient id="airGradient" x1="0" x2="1">
            <stop offset="0" stop-color="#70d6ff"/>
            <stop offset=".5" stop-color="#55d6a8"/>
            <stop offset="1" stop-color="#f4b942"/>
          </linearGradient>
          <linearGradient id="heatGradient" x1="0" x2="1">
            <stop offset="0" stop-color="#56c8ef"/>
            <stop offset=".55" stop-color="#f1c84b"/>
            <stop offset="1" stop-color="#ef6a57"/>
          </linearGradient>
        </defs>
        <path class="air-line air-line-main" pathLength="1" d="M-40 170 C110 95 210 220 355 146 S615 80 965 142"/>
        <path class="air-line air-line-soft" pathLength="1" d="M-20 212 C132 145 228 255 382 192 S650 132 950 178"/>
        <path class="data-line" pathLength="1" d="M180 286 C265 270 300 295 365 270 S474 210 548 240 S665 305 764 248"/>
        <circle class="data-dot dot-one" cx="365" cy="270" r="5"/>
        <circle class="data-dot dot-two" cx="548" cy="240" r="5"/>
        <g class="tree-mark" transform="translate(705 198)">
          <path d="M18 70 V109"/>
          <path d="M18 78 C-22 64 -13 27 12 34 C14 5 58 11 53 42 C78 47 69 82 18 78Z"/>
        </g>
      </svg>

      <div class="wordmark" aria-hidden="true">
        <span>A</span><i>.</i><span>R</span><i>.</i><span>I</span><i>.</i><span>A</span><i>.</i>
      </div>
      <h1 class="sr-only">A.R.I.A.</h1>
      <p class="subtitle">Analisi e Rappresentazione degli Indicatori Ambientali</p>
      <div class="spectrum" aria-hidden="true"><span></span></div>
      <p class="signal" aria-hidden="true">ARIA · TEMPERATURA · ALBERI</p>
    </div>
  </section>

  <aside class="demo-controls" id="demoControls" hidden>
    <p>La splash è stata rimossa dal DOM.</p>
    <button id="replaySplash" type="button">Ripeti</button>
  </aside>

  <template id="splashTemplate">
    <!-- Il contenuto viene catturato da JavaScript prima della prima riproduzione. -->
  </template>
  <script src="splash.js"></script>
</body>
</html>
